<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/popup.css"/>
  <title>Ward</title>
</head>
<body>
<div id="header">
  <h1>와드!</h1>
</div>
<hr>
<div id="content">
  <!--logout status section-->
  <div id="logged-out-div" hidden>
    <p>Github Login</p>
    <button id="github-login-btn">Login</button>
    <!--device flow code section-->
    <div id="device-code-div" hidden>
      <p>코드가 클립보드에 복사되었습니다:</p>
      <p id="user-code"></p>
      <a id="verification-link" href="#" target="_blank">GitHub에서 인증하기</a>
      <p>인증 완료 후 자동으로 로그인됩니다.</p>
    </div>
    <hr>
  </div>
  <!--login status section-->
  <div id="logged-in-div" hidden>
    <p>로그인 됐음</p>
    <button id="clear-temp-btn">storage clear</button>
    <!--repository information section-->
    <div id="repo-info-div">
      <p id="registered-repo-name" hidden></p>
      <button id="repo-register-btn" hidden>레포지토리 등록</button>
      <!--이름 충돌 시 표시-->
      <div id="repo-conflict-div" hidden>
        <p>이미 'ward' 레포지토리가 존재합니다. 다른 이름을 입력하세요:</p>
        <label for="repo-name-input"></label>
        <input type="text" id="repo-name-input" placeholder="Enter repository name">
        <button id="repo-custom-register-btn">등록</button>
      </div>
    </div>
    <!--save ward div-->
    <div id="save-ward-div">
      <button id="save-btn">해당 페이지 저장하기</button>
    </div>
  </div>

</div>
<script type="module" src="popup.js"></script>
</body>
</html>
