<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/popup.css"/>
  <title>Ward</title>
</head>
<body>
<div id="header">
  <h1>와드!</h1>
</div>
<hr>
<div id="content">
  <!--logout status section-->
  <div id="logged-out-div" hidden>
    <p>Github Login</p>
    <button id="github-login-btn">Login</button>
    <!--device flow code section-->
    <div id="device-code-div" hidden>
      <p>코드가 클립보드에 복사되었습니다:</p>
      <p id="user-code"></p>
      <a id="verification-link" href="#" target="_blank">GitHub에서 인증하기</a>
      <p>인증 완료 후 자동으로 로그인됩니다.</p>
    </div>
    <hr>
  </div>
  <!--login status section-->
  <div id="logged-in-div" hidden>
    <p>로그인 됐음</p>
    <!--repository information section-->
    <div id="repo-info-div">
      <div id="registered-repo-div" hidden>
        <p id="registered-repo-name"></p>
        <button id="repo-disconnect-btn">레포지토리 해제</button>
      </div>
      <div id="repo-register-div" hidden>
        <label for="repo-name-input"></label>
        <input type="text" id="repo-name-input" placeholder="레포지토리 이름" value="ward">
        <button id="repo-register-btn">레포지토리 등록</button>
        <p id="repo-error-message" hidden></p>
      </div>
    </div>
    <!--save ward div-->
    <div id="save-ward-div">
      <div id="highlights-div" hidden>
        <h4>수집한 구절 (<span id="highlights-count">0</span>)</h4>
        <ul id="highlights-list"></ul>
      </div>
      <button id="save-btn">해당 페이지 저장하기</button>
      <div id="save-loading-div" hidden>
        <span class="spinner"></span>
        <p>저장 중...</p>
      </div>
      <div id="save-result-div" hidden>
        <p id="save-result-message"></p>
        <a id="save-result-link" href="#" target="_blank"></a>
      </div>
    </div>
  </div>

</div>
<script type="module" src="popup.js"></script>
</body>
</html>
